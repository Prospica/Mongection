variables:
    TAG: $CI_COMMIT_TAG
stages:          
    - security-test
    - build
    - deploy

sast:
    rules:
        - if: $CI_COMMIT_TAG =~ /^ocp/i
    stage: security-test 
    script:

sca:
    rules:
        - if: $CI_COMMIT_TAG =~ /^ocp/i
    stage: security-test 
    script:

quality-gate:
    rules:
        - if: $CI_COMMIT_TAG =~ /^ocp/i
    stage: security-test
    needs: ["sast", "sca"]
    script:
        
build-and-push-image:
    tags:
    stage: build
    only:
        - tags
    script:
        - docker build . -t registry.i-3.my.id:5500/mongection/mongection-app:$TAG -f deployments/mongection.Dockerfile
        - docker build . -t registry.i-3.my.id:5500/mongection/mongection-db:$TAG -f deployments/mongo.Dockerfile
        - docker login --username=$NEXUS_USR --password=$NEXUS_PSW registry.i-3.my.id:5500
        - docker push registry.i-3.my.id:5500/mongection/mongection-app:$TAG
        - docker push registry.i-3.my.id:5500/mongection/mongection-db:$TAG

deploy-to-ocp:
    stage: deploy
    only:
        - tags
    before_script:
        - export VER=$(echo $CI_COMMIT_TAG | grep -P '^[^-]*' -o)
    script:
        - sed -i "s/ocp-[^']*/$TAG/" deployment-app.yaml
        - sed -i "s/ocp-[^']*/$TAG/" deployment-db.yaml
        # - sed -i "s/$VER-.*/$TAG'/" deployment-app.yaml
        # - sed -i "s/$VER-.*/$TAG'/" deployment-db.yaml
        - oc login --token $OCP_TOKEN --server=https://api.lab.i-3.my.id:6443 --insecure-skip-tls-verify
        - oc apply -f deployment-app.yaml
        - oc apply -f deployment-db.yaml
