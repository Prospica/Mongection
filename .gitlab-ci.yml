variables:
    TAG: $CI_COMMIT_TAG
stages:          
    - security-test
    - build
    - deploy

sast:
    tags:
        - datadog
    rules:
        - if: $CI_COMMIT_TAG =~ /^alpha/i
    stage: security-test 
    before_script:
        - export DD_SITE="us5.datadoghq.com"
        - export DD_API_KEY=2adf38efb834bf73a62df0f71d8e3588
        - export DD_APP_KEY=3aa5383586c349edf8e30595a0f600b8746728f6
    script:
        - /usr/local/datadog-static-analyzer -i . -o /home/gitlab-runner/report.sarif -f sarif
        - datadog-ci sarif upload /home/gitlab-runner/report.sarif

sca:
    tags:
        - datadog
    rules:
        - if: $CI_COMMIT_TAG =~ /^alpha/i
    stage: security-test 
    before_script:
        - export DD_SITE="us5.datadoghq.com"
        - export DD_API_KEY=2adf38efb834bf73a62df0f71d8e3588
        - export DD_APP_KEY=3aa5383586c349edf8e30595a0f600b8746728f6
    script:
        - /osv-scanner/osv-scanner --skip-git -r --experimental-only-packages --format=cyclonedx-1-5 --paths-relative-to-scan-dir  --output=/home/gitlab-runner/sbom.json .
        - datadog-ci sbom upload /home/gitlab-runner/sbom.json

quality-gate:
    tags:
        - datadog
    rules:
        - if: $CI_COMMIT_TAG =~ /^alpha/i
    stage: security-test
    needs: ["sast", "sca"]
    before_script:
        - export DD_SITE="us5.datadoghq.com"
        - export DD_API_KEY=2adf38efb834bf73a62df0f71d8e3588
        - export DD_APP_KEY=3aa5383586c349edf8e30595a0f600b8746728f6
    script:
        - datadog-ci gate evaluate
