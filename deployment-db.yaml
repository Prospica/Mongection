kind: Deployment
apiVersion: apps/v1
metadata:
  name: mongection-db
  namespace: mongection
  labels:
    tags.datadoghq.com/env: sit
    tags.datadoghq.com/service: mongection
    tags.datadoghq.com/version: ocp-v1.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongection-db
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mongection-db
        tags.datadoghq.com/env: sit
        tags.datadoghq.com/service: mongection
        tags.datadoghq.com/version: ocp-v1.0.0
        admission.datadoghq.com/enabled: "true"
      annotations:
        admission.datadoghq.com/js-lib.version: v5.37.0
    spec:
      containers:
        - name: mongection-db
          image: 'registry.i-3.my.id:5500/mongection/mongection-db:ocp-v1.0.0'
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
            - name: DD_APPSEC_SCA_ENABLED
              value: "true"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1"
          ports:
            - containerPort: 27017
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1002
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: registry-i3
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
