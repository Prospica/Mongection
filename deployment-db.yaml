kind: Deployment
apiVersion: apps/v1
metadata:
  name: mongection-db
  namespace: mongection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongection-db
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: mongection-db
    spec:
      containers:
        - name: mongection-db
          image: 'registry.i-3.my.id:5500/mongection/mongection-db:ocp-v1.0.0'
          ports:
            - containerPort: 27017
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1002
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: registry-i3
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
